<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña — Tlapalería Central</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-split-container" style="max-width: 540px;">
    <div class="auth-form-side" style="padding: 40px;">
      <div class="auth-header">
        <div class="auth-header-logo">
          <span style="color: var(--color-primary);">Tlapalería</span> <span style="color: var(--color-accent);">Central</span>
        </div>
        <h3 id="formTitle">¿Olvidaste tu contraseña?</h3>
        <p id="formSubtitle">Ingresa tu correo para recibir un enlace de restablecimiento seguro (vigencia 30 minutos).</p>
      </div>

      <div id="alertBox" style="display: none;" class="alert"></div>

      <!-- Paso 1: Solicitar enlace mediante correo -->
      <form id="requestResetForm">
        <div class="form-group">
          <label class="form-label" for="requestEmail">Correo electrónico registrado</label>
          <input type="email" id="requestEmail" class="form-control" placeholder="tu@correo.com" required>
        </div>

        <button type="submit" id="requestBtn" class="btn btn-primary btn-full" style="padding: 12px; margin-top: 10px;">
          Enviar enlace de recuperación
        </button>

        <div style="text-align: center; margin-top: 20px;">
          <a href="/login.html" style="color: var(--color-primary); font-size: 0.88rem; text-decoration: none; font-weight: 600;">
            ← Volver a Iniciar Sesión
          </a>
        </div>
      </form>

      <!-- Paso 2: Establecer nueva contraseña si hay token en URL -->
      <form id="newPasswordForm" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="newPassword">Nueva contraseña</label>
          <div class="input-password-wrapper">
            <input type="password" id="newPassword" class="form-control" placeholder="Mínimo 12 caracteres" minlength="12" maxlength="128" required>
            <button type="button" class="toggle-password-btn" id="togglePass1">👁</button>
          </div>
          <small style="color: var(--color-text-muted); font-size: 0.78rem;">Mínimo 12 caracteres.</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmar nueva contraseña</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repite la nueva contraseña" required>
        </div>

        <button type="submit" id="resetBtn" class="btn btn-primary btn-full" style="padding: 12px; margin-top: 10px;">
          Guardar nueva contraseña
        </button>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const alertBox = document.getElementById('alertBox');
    const requestResetForm = document.getElementById('requestResetForm');
    const newPasswordForm = document.getElementById('newPasswordForm');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.style.display = 'block';
    }

    // Si viene con token en la URL, mostrar Paso 2
    if (token) {
      formTitle.textContent = 'Restablecer contraseña';
      formSubtitle.textContent = 'Ingresa tu nueva contraseña para acceder a tu cuenta.';
      requestResetForm.style.display = 'none';
      newPasswordForm.style.display = 'block';
    }

    // Toggle de contraseña
    const togglePass1 = document.getElementById('togglePass1');
    const newPasswordInput = document.getElementById('newPassword');
    togglePass1.addEventListener('click', () => {
      const isPass = newPasswordInput.type === 'password';
      newPasswordInput.type = isPass ? 'text' : 'password';
      togglePass1.textContent = isPass ? '🔒' : '👁';
    });

    // Envío del Paso 1: Solicitar enlace
    requestResetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('requestEmail').value.trim();
      const requestBtn = document.getElementById('requestBtn');

      requestBtn.disabled = true;
      requestBtn.textContent = 'Procesando...';

      try {
        const res = await fetch('/api/auth/recuperar-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        showAlert(data.message || 'Si el correo está registrado, se ha emitido un enlace de recuperación en la consola del servidor (vigencia 30 min).', false);
        requestResetForm.reset();
        requestBtn.disabled = false;
        requestBtn.textContent = 'Enviar enlace de recuperación';
      } catch (err) {
        console.error('Error:', err);
        showAlert('Error de conexión con el servidor.');
        requestBtn.disabled = false;
        requestBtn.textContent = 'Enviar enlace de recuperación';
      }
    });

    // Envío del Paso 2: Guardar nueva contraseña
    newPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const password = newPasswordInput.value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const resetBtn = document.getElementById('resetBtn');

      if (password.length < 12) {
        showAlert('La nueva contraseña debe tener al menos 12 caracteres.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Las contraseñas no coinciden.');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Actualizando...';

      try {
        const res = await fetch('/api/auth/resetear-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'El enlace es inválido o ha expirado.');
          resetBtn.disabled = false;
          resetBtn.textContent = 'Guardar nueva contraseña';
          return;
        }

        showAlert('¡Contraseña restablecida exitosamente! Redirigiendo al login...', false);
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } catch (err) {
        console.error('Error:', err);
        showAlert('Error al procesar el cambio de contraseña.');
        resetBtn.disabled = false;
        resetBtn.textContent = 'Guardar nueva contraseña';
      }
    });
  </script>
</body>
</html>

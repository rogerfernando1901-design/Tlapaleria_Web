<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pedido — Tlapalería Central</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Barra superior -->
  <div class="top-bar">
    <span>Paso final: Confirmación y reserva de productos para recolección en tienda.</span>
    <span>Pago presencial al recoger · Folio único</span>
  </div>

  <!-- Cabecera -->
  <header class="main-header">
    <a href="/" class="brand-container">
      <div class="brand-icon">🔨</div>
      <div>
        <div class="brand-name">Tlapalería Central</div>
        <div class="brand-subtitle">SISTEMA DE COMPRAS EN LÍNEA</div>
      </div>
    </a>

    <div class="header-actions" id="headerActions"></div>
  </header>

  <!-- Contenido principal -->
  <main class="main-content" style="max-width: 800px;">
    <div id="checkoutStateArea">
      <div style="text-align: center; padding: 40px; background: white; border-radius: var(--radius-md);">
        Verificando estado de la cuenta y artículos...
      </div>
    </div>
  </main>

  <footer class="main-footer">
    <p>Tlapalería Central &copy; 2026. Todos los derechos reservados.</p>
  </footer>

  <script src="/js/cart.js"></script>
  <script src="/js/main.js"></script>
  <script>
    const checkoutStateArea = document.getElementById('checkoutStateArea');

    async function initCheckout() {
      // 1. Verificar autenticación
      const user = await App.checkAuth();

      if (!user) {
        checkoutStateArea.innerHTML = `
          <div style="background-color: var(--color-surface); padding: 48px 32px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--color-border); box-shadow: var(--shadow-sm);">
            <div style="font-size: 3rem; margin-bottom: 16px;">🔒</div>
            <h2 style="color: var(--color-primary); margin-bottom: 12px;">Se requiere iniciar sesión</h2>
            <p style="color: var(--color-text-muted); max-width: 500px; margin: 0 auto 24px auto;">
              Cualquier visitante puede preparar su carrito, pero para confirmar un pedido y reservar inventario es indispensable iniciar sesión con una cuenta de cliente.
            </p>
            <div style="display: inline-flex; gap: 12px;">
              <a href="/login.html" class="btn btn-primary" style="padding: 12px 24px;">Iniciar sesión</a>
              <a href="/registro.html" class="btn btn-secondary" style="padding: 12px 24px;">Crear una cuenta</a>
            </div>
          </div>
        `;
        return;
      }

      // 2. [HU-04, HU-08] Verificar si el correo está confirmado
      if (!user.is_verified) {
        checkoutStateArea.innerHTML = `
          <div style="background-color: var(--color-surface); padding: 48px 32px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--color-border); box-shadow: var(--shadow-sm);">
            <div style="font-size: 3rem; margin-bottom: 16px;">✉️</div>
            <h2 style="color: var(--color-warning); margin-bottom: 12px;">Cuenta pendiente de verificación</h2>
            <p style="color: var(--color-text-muted); max-width: 520px; margin: 0 auto 16px auto;">
              Hola, <strong>${escapeHtml(user.name)}</strong>. Por seguridad de la tienda, es obligatorio verificar tu correo electrónico (<strong>${escapeHtml(user.email)}</strong>) antes de confirmar y apartar pedidos.
            </p>
            <p style="font-size: 0.85rem; color: #777777; margin-bottom: 24px;">
              En entorno de desarrollo local, busca el enlace de activación generado en la consola del servidor.
            </p>
            <div style="display: inline-flex; gap: 12px;">
              <button id="resendVerificationBtn" class="btn btn-primary">Reenviar enlace de verificación</button>
              <a href="/carrito.html" class="btn btn-secondary">Volver al carrito</a>
            </div>
            <div id="resendAlert" style="display: none; max-width: 400px; margin: 16px auto 0 auto;" class="alert"></div>
          </div>
        `;

        document.getElementById('resendVerificationBtn').addEventListener('click', async () => {
          const resendAlert = document.getElementById('resendAlert');
          try {
            const r = await fetch('/api/auth/reenviar-verificacion', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: user.email })
            });
            const d = await r.json();
            resendAlert.textContent = d.message || 'Se ha generado un nuevo enlace en la consola del servidor.';
            resendAlert.className = 'alert alert-info';
            resendAlert.style.display = 'block';
          } catch (e) {
            resendAlert.textContent = 'Error al solicitar el reenvío.';
            resendAlert.className = 'alert alert-error';
            resendAlert.style.display = 'block';
          }
        });

        return;
      }

      // 3. Validar artículos del carrito con el servidor
      const cartItems = Cart.getItems();
      if (cartItems.length === 0) {
        checkoutStateArea.innerHTML = `
          <div style="background-color: var(--color-surface); padding: 48px 32px; border-radius: var(--radius-md); text-align: center;">
            <h2>No tienes artículos en tu carrito</h2>
            <p style="margin: 16px 0;"><a href="/" class="btn btn-primary">Ir al catálogo</a></p>
          </div>
        `;
        return;
      }

      try {
        const payload = cartItems.map(i => ({
          id: i.id,
          quantity: i.quantity,
          client_price_cents: i.price_cents
        }));

        const valRes = await fetch('/api/carrito/validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: payload })
        });

        const valData = await valRes.json();
        renderCheckoutForm(user, valData);
      } catch (err) {
        checkoutStateArea.innerHTML = `<div class="alert alert-error">Error al validar existencias para el pedido.</div>`;
      }
    }

    function renderCheckoutForm(user, validatedData) {
      const items = validatedData.items || [];
      const hasErrors = validatedData.has_errors;
      const priceChanged = validatedData.price_changed;

      checkoutStateArea.innerHTML = `
        <div style="background-color: var(--color-surface); padding: 32px; border-radius: var(--radius-md); border: 1px solid var(--color-border); box-shadow: var(--shadow-sm);">
          <h2 style="color: var(--color-primary); margin-bottom: 8px;">Confirmación de Pedido para Recolección</h2>
          <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 24px;">
            Revisa los detalles de tu pedido. Al confirmar, se generará un folio único y se reservarán los artículos en tienda.
          </p>

          <div id="checkoutAlert" class="alert ${priceChanged || hasErrors ? 'alert-warning' : ''}" style="${priceChanged || hasErrors ? 'display: block;' : 'display: none;'}">
            ${priceChanged ? 'Aviso: Uno o más productos actualizaron su precio en catálogo. Al confirmar estarás aceptando los precios vigentes.' : ''}
            ${hasErrors ? 'Aviso: Algunas existencias no son suficientes. Por favor ajusta tu carrito.' : ''}
          </div>

          <!-- Datos del cliente -->
          <div style="background-color: #F8F9FA; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem;">
            <div style="font-weight: 700; color: var(--color-primary); margin-bottom: 6px;">Datos de quien recoge:</div>
            <div><strong>Nombre:</strong> ${escapeHtml(user.name)}</div>
            <div><strong>Correo:</strong> ${escapeHtml(user.email)}</div>
            <div><strong>Teléfono:</strong> ${escapeHtml(user.phone)}</div>
          </div>

          <!-- Tabla de artículos -->
          <div class="table-container" style="margin-bottom: 20px;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th style="text-align: center;">Cantidad</th>
                  <th style="text-align: right;">Precio Unitario</th>
                  <th style="text-align: right;">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(it => `
                  <tr>
                    <td>
                      <strong>${escapeHtml(it.name)}</strong>
                      ${it.error ? `<div style="color: var(--color-error); font-size: 0.75rem;">${escapeHtml(it.error)}</div>` : ''}
                    </td>
                    <td style="text-align: center;">${it.valid_quantity}</td>
                    <td style="text-align: right;">$${it.price} MXN</td>
                    <td style="text-align: right; font-weight: 700;">$${it.subtotal} MXN</td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr style="background-color: #F8F9FA; font-size: 1.15rem;">
                  <td colspan="3" style="text-align: right; font-weight: 800; color: var(--color-primary);">Total a Pagar en Tienda:</td>
                  <td style="text-align: right; font-weight: 800; color: var(--color-primary);">$${validatedData.total} MXN</td>
                </tr>
              </tfoot>
            </table>
          </div>

          <!-- Condiciones de recolección -->
          <div style="border-left: 4px solid var(--color-accent); background-color: #FFF8E1; padding: 14px 16px; margin-bottom: 24px; font-size: 0.88rem;">
            <strong>📌 Condiciones del Pedido:</strong>
            <ul style="margin-left: 20px; margin-top: 6px;">
              <li><strong>Pago presencial:</strong> Pagarás directamente en mostrador al recoger tu pedido (efectivo o tarjeta).</li>
              <li><strong>Plazo de recolección:</strong> Tu mercancía permanecerá reservada por <strong>48 horas naturales</strong> a partir de este momento.</li>
              <li><strong>Folio único:</strong> Deberás presentar tu folio en tienda para entregar tu pedido.</li>
            </ul>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <a href="/carrito.html" class="btn btn-secondary">← Volver al carrito</a>
            <button id="confirmOrderBtn" class="btn btn-primary" style="padding: 14px 28px; font-size: 1.1rem;" ${hasErrors ? 'disabled' : ''}>
              ✓ Confirmar Pedido y Generar Folio
            </button>
          </div>
        </div>
      `;

      document.getElementById('confirmOrderBtn').addEventListener('click', () => processOrderConfirmation(items));
    }

    async function processOrderConfirmation(items) {
      const btn = document.getElementById('confirmOrderBtn');
      btn.disabled = true;
      btn.textContent = 'Procesando y reservando...';

      const payload = {
        items: items.map(i => ({
          id: i.id,
          quantity: i.valid_quantity,
          accepted_price_cents: i.price_cents
        }))
      };

      try {
        const response = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          alert('Error al confirmar: ' + (data.error || 'Ocurrió un error.'));
          btn.disabled = false;
          btn.textContent = '✓ Confirmar Pedido y Generar Folio';
          return;
        }

        // Vaciar carrito tras confirmación exitosa (HU-08)
        Cart.clear();

        // Mostrar pantalla de éxito con folio único
        renderOrderSuccess(data.order);
      } catch (err) {
        console.error('Error de red:', err);
        alert('Error al conectar con el servidor.');
        btn.disabled = false;
        btn.textContent = '✓ Confirmar Pedido y Generar Folio';
      }
    }

    function renderOrderSuccess(order) {
      const deadlineDate = new Date(order.pickupDeadline).toLocaleString('es-MX', {
        dateStyle: 'full',
        timeStyle: 'short'
      });

      checkoutStateArea.innerHTML = `
        <div style="background-color: var(--color-surface); padding: 48px 32px; border-radius: var(--radius-md); text-align: center; border: 2px solid var(--color-success); box-shadow: var(--shadow-md);">
          <div style="font-size: 3.5rem; margin-bottom: 12px;">🎉</div>
          <h1 style="color: var(--color-primary); font-size: 2rem; margin-bottom: 8px;">¡Pedido Confirmado con Éxito!</h1>
          <p style="color: var(--color-text-muted); font-size: 1rem; margin-bottom: 24px;">
            Tu mercancía ha quedado reservada en tienda sin sobreventa.
          </p>

          <div style="background-color: #F0F7FF; border: 2px dashed var(--color-primary); padding: 24px; border-radius: var(--radius-md); max-width: 480px; margin: 0 auto 28px auto;">
            <div style="font-size: 0.85rem; font-weight: 700; color: var(--color-text-muted); letter-spacing: 1px; text-transform: uppercase;">
              Folio Único de Pedido
            </div>
            <div style="font-size: 2.2rem; font-weight: 800; color: var(--color-primary); letter-spacing: 2px; margin: 8px 0;">
              ${escapeHtml(order.folio)}
            </div>
            <div style="font-size: 1.1rem; font-weight: 700; color: var(--color-accent);">
              Total a pagar en mostrador: $${order.total} MXN
            </div>
          </div>

          <div style="max-width: 500px; margin: 0 auto 32px auto; text-align: left; background-color: #F8F9FA; padding: 20px; border-radius: var(--radius-sm); font-size: 0.9rem;">
            <p style="margin-bottom: 8px;"><strong>⏱ Límite de recolección:</strong> ${deadlineDate} (48 horas naturales).</p>
            <p style="margin-bottom: 8px;"><strong>📍 Dirección:</strong> Av. Central #123, Col. Centro.</p>
            <p style="margin-bottom: 8px;"><strong>💵 Forma de pago:</strong> Efectivo o tarjeta al momento de la entrega física.</p>
            <p style="font-size: 0.82rem; color: #777777;">Presenta este folio impreso o en tu teléfono para recoger tu compra.</p>
          </div>

          <div style="display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <a href="/perfil.html" class="btn btn-primary" style="padding: 12px 24px;">Ver en Mi Historial de Pedidos</a>
            <a href="/" class="btn btn-secondary" style="padding: 12px 24px;">Volver a la tienda</a>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initCheckout();
    });
  </script>
</body>
</html>
